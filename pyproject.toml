[project]
name = "renderbinder"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "A local, read-only ComfyUI output gallery and prompt library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "Pillow>=11.1,<13",
    "watchdog>=6,<7",
    "httpx>=0.28,<1",
    "rapidfuzz>=3.14,<4",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers[image]>=6.1,<7",
    "transformers>=5.18,<6",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "numpy>=2.2,<3", "ruff==0.17.2"]

[tool.uv]
package = false

# Semantic matching is CPU-only. These indexes are used only for these packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "I"]
