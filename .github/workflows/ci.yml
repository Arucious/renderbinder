name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.8'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} ruff check app tests scripts
      - run: uv run --locked --python ${{ matrix.python }} pytest -q

  browser:
    name: Frontend and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.8'
          python-version: '3.13'
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/setup.sh
      - run: pnpm --dir frontend test
      - name: Install browser and Linux libraries
        run: pnpm --dir frontend exec playwright install --with-deps chrome
      - run: uv run --locked python scripts/browser_checks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            .qa/*.png
            .qa/*error.txt
            .qa/browser-server.log
          retention-days: 7
